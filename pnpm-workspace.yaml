packages:
  - platform/*
  # The pure part of every industry (industries/<id>/core); the React part (industries/<id>/web)
  # gets its own line with W0-03.
  - industries/*/core
  - tools

# Install only versions published at least three days ago: a poisoned release is usually found
# and pulled within hours (pattern from the gastronomy edition).
minimumReleaseAge: 4320
